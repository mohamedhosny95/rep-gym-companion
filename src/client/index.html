<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:title" content="Health OS">
  <meta property="og:description" content="Training, nutrition, recovery, and daily health in one private mobile companion.">
  <meta property="og:image" content="rep-social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Health OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Health OS">
  <meta name="theme-color" content="#070908">
  <link rel="stylesheet" href="styles.css?v=__BUILD_VERSION__">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Today">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>HEALTH OS</span>
      </button>
      <div class="top-actions">
        <span class="offline-pill" id="networkStatus"><i></i> Offline ready</span>
        <button class="icon-button" id="previewModeButton" aria-label="Toggle Preview / Sandbox Mode" title="Preview Mode (No changes saved)">🔬</button>
        <button class="icon-button" id="commandPaletteButton" aria-label="Open Command Palette (Cmd+K)" title="Command Palette (Cmd+K)">🔍</button>
        <button class="text-button" id="langButton" aria-label="Switch language">العربية</button>
        <button class="icon-button sync-shortcut" id="syncButton" aria-label="Sync everything" title="Sync everything"><span data-sync-icon aria-hidden="true">↻</span><span data-sync-badge hidden></span></button>
        <button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button>
        <button class="icon-button" id="wakeButton" aria-label="Keep screen awake" aria-pressed="false">☼</button>
        <button class="icon-button" id="soundButton" aria-label="Mute timer sounds" aria-pressed="false">◖</button>
      </div>
    </header>

    <main id="app"></main>
    <nav class="app-tabs" id="appTabs" aria-label="Main app sections">
      <button data-app-tab="home" aria-current="page"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg></i><span>Today</span></button>
      <button data-app-tab="train"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="3" height="10" rx="1"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><rect x="16.5" y="7" width="3" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg></i><span>Training</span></button>
      <button data-app-tab="food"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></i><span>Nutrition</span></button>
      <button data-app-tab="health"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.5C.5 7.5 3 4 6.5 4c2 0 3.5 1.2 4.5 2.8C12 5.2 13.5 4 15.5 4 19 4 21.5 7.5 20 11.5 17.5 16.4 12 21 12 21z"/><polyline points="6,13 9,13 10.5,10 12.5,16 14,13 18,13"/></svg></i><span>Health</span></button>
      <button data-app-tab="insights"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></i><span>Insights</span></button>
    </nav>
  </div>

  <div class="quick-log" id="quickLog"></div>

  <div class="timer-dock is-hidden" id="timerDock" role="timer" aria-live="off" inert>
    <div class="timer-ring" id="timerRing"><span id="timerValue">1:30</span></div>
    <div class="timer-copy">
      <strong>REST</strong>
      <span id="timerNext">Next set</span>
    </div>
    <button id="timerAdd" class="timer-action">+15</button>
    <button id="timerPause" class="timer-action">Pause</button>
    <button id="timerSkip" class="timer-skip">Skip</button>
  </div>

  <script src="vendor/dompurify.min.js?v=__BUILD_VERSION__" defer></script>
  <script src="safe-dom.js?v=__BUILD_VERSION__" defer></script>
  <script src="build-meta.js?v=__BUILD_VERSION__" defer></script>
  <script src="auth.js?v=__BUILD_VERSION__" defer></script>
  <script src="storage.js?v=__BUILD_VERSION__" defer></script>
  <script src="ui-state.js?v=__BUILD_VERSION__" defer></script>
  <script src="ui-shell.js?v=__BUILD_VERSION__" defer></script>
  <script src="health-data.js?v=__BUILD_VERSION__" defer></script>
  <script src="i18n.js?v=__BUILD_VERSION__" defer></script>
  <script src="features.js?v=__BUILD_VERSION__" defer></script>
  <script src="health-engine.js?v=__BUILD_VERSION__" defer></script>
  <script src="health-coverage.js?v=__BUILD_VERSION__" defer></script>
  <script src="performance-insights.js?v=__BUILD_VERSION__" defer></script>
  <script src="training-session.js?v=__BUILD_VERSION__" defer></script>
  <script src="bootstrap.js?v=__BUILD_VERSION__" defer></script>
</body>
</html>
