<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="description" content="A fast, offline Health OS for daily training, nutrition, and care.">
  <title>Health OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Health OS">
  <link rel="stylesheet" href="styles.css?v=39">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Back to sessions">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>HEALTH OS</span>
      </button>
      <div class="top-actions">
        <span class="offline-pill" id="networkStatus"><i></i> Offline ready</span>
        <button class="text-button" id="langButton" aria-label="Switch language">العربية</button>
        <button class="icon-button" id="wakeButton" aria-label="Keep screen awake" aria-pressed="false">☼</button>
        <button class="icon-button" id="soundButton" aria-label="Mute timer sounds" aria-pressed="false">◖</button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>
    <nav class="app-tabs" id="appTabs" aria-label="Main app sections">
      <button data-app-tab="train" aria-current="page"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="3" height="10" rx="1"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><rect x="16.5" y="7" width="3" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg></i><span>Training</span></button>
      <button data-app-tab="food"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></i><span>Nutrition</span></button>
      <button data-app-tab="care"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></i><span>Wellness</span></button>
      <button data-app-tab="insights"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="20" y1="20" x2="20" y2="9"/></svg></i><span>Insights</span></button>
    </nav>
  </div>

  <div class="timer-dock is-hidden" id="timerDock" role="timer" aria-live="assertive">
    <div class="timer-ring" id="timerRing"><span id="timerValue">1:30</span></div>
    <div class="timer-copy">
      <strong>REST</strong>
      <span id="timerNext">Next set</span>
    </div>
    <button id="timerAdd" class="timer-action">+15</button>
    <button id="timerPause" class="timer-action">Pause</button>
    <button id="timerSkip" class="timer-skip">Skip</button>
  </div>

  <script src="health-data.js?v=39" defer></script>
  <script src="i18n.js" defer></script>
  <script src="app.js?v=39" defer></script>
</body>
</html>
