<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="description" content="A fast, offline workout companion for morning mobility, strength, cardio, and recovery.">
  <title>Rep — Gym Companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rep">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Back to sessions">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>REP</span>
      </button>
      <div class="top-actions">
        <span class="offline-pill" id="networkStatus"><i></i> Offline ready</span>
        <button class="text-button" id="langButton" aria-label="Switch language">العربية</button>
        <button class="icon-button" id="wakeButton" aria-label="Keep screen awake" aria-pressed="false">☼</button>
        <button class="icon-button" id="soundButton" aria-label="Mute timer sounds" aria-pressed="false">◖</button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>
    <nav class="app-tabs" id="appTabs" aria-label="Main app sections">
      <button data-app-tab="train" aria-current="page"><i aria-hidden="true">↗</i><span>Train</span></button>
      <button data-app-tab="food"><i aria-hidden="true">◒</i><span>Food</span></button>
      <button data-app-tab="care"><i aria-hidden="true">✦</i><span>Care</span></button>
    </nav>
  </div>

  <div class="timer-dock is-hidden" id="timerDock" role="timer" aria-live="assertive">
    <div class="timer-ring" id="timerRing"><span id="timerValue">1:30</span></div>
    <div class="timer-copy">
      <strong>REST</strong>
      <span id="timerNext">Next set</span>
    </div>
    <button id="timerAdd" class="timer-action">+15</button>
    <button id="timerPause" class="timer-action">Pause</button>
    <button id="timerSkip" class="timer-skip">Skip</button>
  </div>

  <script src="health-data.js?v=15" defer></script>
  <script src="i18n.js" defer></script>
  <script src="app.js?v=15" defer></script>
</body>
</html>
