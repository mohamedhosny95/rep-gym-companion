<body class="training-first-app">
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Today">
        <span class="brand-mark" aria-hidden="true">▲</span>
        <span>AWJ <span lang="ar">أوج</span></span>
      </button>
      <div class="top-actions">
        <span class="offline-pill" id="networkStatus"><i></i> App available offline</span>
        <button class="icon-button" id="wakeButton" aria-label="Keep screen awake" aria-pressed="false">☼</button>
        <button class="icon-button" id="soundButton" aria-label="Mute timer sounds" aria-pressed="false">◖</button>
        <button class="icon-button sync-shortcut" id="syncButton" aria-label="Sync everything" title="Sync everything"><span data-sync-icon aria-hidden="true">↻</span><span data-sync-badge hidden></span></button>
        <button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button>
        <button class="icon-button" id="topMoreButton" aria-haspopup="true" aria-expanded="false" aria-label="More options">⋯</button>
      </div>
      <div class="top-more-menu" id="topMoreMenu" hidden>
        <button class="top-more-item" id="commandPaletteButton" aria-label="Open Command Palette (Cmd+K)"><i aria-hidden="true">🔍</i><span>Command palette</span></button>
        <button class="top-more-item" id="previewModeButton" aria-label="Toggle Preview / Sandbox Mode" title="Preview Mode (No changes saved)"><i aria-hidden="true">🔬</i><span>Preview mode</span></button>
      </div>
    </header>

    <main id="app" aria-busy="true"></main>
    <nav class="app-tabs" id="appTabs" aria-label="Main app sections">
      <button data-app-tab="home" aria-current="page"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg></i><span>Today</span></button>
      <button data-app-tab="train"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="3" height="10" rx="1"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><rect x="16.5" y="7" width="3" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg></i><span>Train</span></button>
      <button data-app-tab="food"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></i><span>Nutrition</span></button>
      <button data-app-tab="wellbeing"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6-8 11-8 11Z"/></svg></i><span>Wellbeing</span></button>
      <button data-app-tab="insights"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10m8 10V4m8 16v-7"/></svg></i><span>Progress</span></button>
    </nav>
  </div>

  <div class="quick-log" id="quickLog"></div>

  <div class="timer-dock is-hidden" id="timerDock" role="timer" aria-live="off" inert>
    <section class="timer-next-preview is-hidden" id="timerNextPreview" aria-label="Next exercise preview" aria-hidden="true">
      <div class="timer-preview-visual" id="timerPreviewVisual" aria-hidden="true"></div>
      <div class="timer-preview-copy">
        <small id="timerPreviewLabel">UP NEXT</small>
        <strong id="timerPreviewName"></strong>
        <span id="timerPreviewMeta"></span>
      </div>
      <button id="timerNextNow" class="timer-next-now" type="button"><span>Start now</span> →</button>
    </section>
    <div class="timer-ring" id="timerRing"><span id="timerValue">1:30</span></div>
    <div class="timer-copy">
      <small>RECOVERY</small>
      <strong>REST</strong>
      <span id="timerNext">Next set</span>
    </div>
    <button id="timerAdd" class="timer-action" type="button" aria-label="Add 15 seconds">+15</button>
    <button id="timerPause" class="timer-action" type="button">Pause</button>
    <button id="timerSkip" class="timer-skip" type="button">Skip</button>
  </div>
