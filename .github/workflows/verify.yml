name: Verify

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Catches syntax errors, dist/outputs drift, and functional regressions (via
# a headless Playwright smoke test) on every push. The verify and e2e jobs
# below are a safety net only and never deploy anything themselves; the
# gated deploy-production job further down is the sole production deployer,
# running only for `main` and only after verify and e2e both pass. Cloudflare's
# own direct Git integration must stay disabled — see docs/RELEASE_SAFETY.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax-check all JavaScript
        run: |
          set -e
          find src dist/server scripts -type f \( -name "*.js" -o -name "*.mjs" \) | while read -r file; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Validate JSON files parse
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('dist/client/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"

      - name: Run Worker and state regression tests
        run: npm test

      - name: Upload deployable client
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: health-os-client-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 14

      - name: Reject committed secret values
        run: |
          if git grep -nE '(NOTION_TOKEN|GEMINI_API_KEY|REP_SYNC_KEY)=[^[:space:]]+' -- ':!README.md' ':!.env.example'; then
            echo "A secret-like value is committed."
            exit 1
          fi

      - name: Check generated client copies (run npm run sync if this fails)
        run: |
          npm run sync
          git diff --exit-code -- dist/client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke test
        run: npm run test:e2e

  live-notion:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      NOTION_TEST_TOKEN: ${{ secrets.NOTION_TEST_TOKEN }}
      NOTION_TEST_DATA_SOURCE_ID: ${{ secrets.NOTION_TEST_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify real Notion schema, write, receipt, and cleanup
        run: npm run test:notion-live

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: health-os-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Deploy the verified main commit
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
