name: Verify

# Safety net only: catches syntax errors and dist/outputs drift before they
# reach Cloudflare, which deploys straight from `main` on every push via its
# own GitHub integration. This workflow never deploys anything.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check all JavaScript
        run: |
          set -e
          find dist scripts -name "*.js" -o -name "*.mjs" | while read -r file; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Validate JSON files parse
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('dist/client/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.openai/hosting.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"

      - name: Check outputs/ matches dist/client/ (run scripts/sync-static.mjs if this fails)
        run: |
          diff -rq dist/client outputs --exclude=rep-gym-companion.zip
